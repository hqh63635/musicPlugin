# Include inside the server {} block serving the music player.
# Example: include /etc/nginx/snippets/changqing.nginx.conf;
location = /changqing-resolve {
    proxy_pass http://175.27.166.236/kgqq1/qq.php;
    proxy_set_header Host 175.27.166.236;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @changqing_url;
    proxy_connect_timeout 15s;
    proxy_read_timeout 20s;
}

location @changqing_url {
    default_type application/json;
    add_header Cache-Control no-store;
    return 200 '{"url":"$upstream_http_location"}';
}
